name: CI/CD NubeStore
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [main]
jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test
      - name: Verificar secreto de Firebase
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NUBESTORE_ECEEB }}
        run: |
          if [ -z "$FIREBASE_KEY" ]; then
            echo "ERROR: El secreto está vacío o no está disponible"
            exit 1
          else
            echo "OK: El secreto está disponible"
          fi
  despliegue:
    needs: pruebas
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NUBESTORE_ECEEB }}
          channelId: live
          projectId: nubestore-eceeb

