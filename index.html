<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NubeStore - Iniciar sesión</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="card">
    <h1>NubeStore</h1>
    <p class="subtitulo">Control de inventario simple para tiendas de barrio</p>

    <div class="tabs">
      <button id="tab-login" class="tab activa" type="button">Iniciar sesión</button>
      <button id="tab-registro" class="tab" type="button">Registrarme</button>
    </div>

    <label for="email">Correo</label>
    <input id="email" type="email" placeholder="tucorreo@ejemplo.com">

    <label for="password">Contraseña</label>
    <input id="password" type="password" placeholder="Mínimo 6 caracteres">

    <button id="btn-enviar" type="button" class="btn">Entrar</button>
    <p id="mensaje" class="mensaje"></p>
  </main>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
